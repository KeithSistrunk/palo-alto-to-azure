<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Palo Alto to Azure: BGP over the IPsec tunnel between the PA-440 and Azure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#ffffff}
    .ink{fill:#1f2937} .quiet{fill:#6b7280} .accent{fill:#c2410c} .lbl-az{fill:#2563eb} .ok{fill:#15803d}
    .fw{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
    .az{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .azbox{fill:#ffffff;stroke:#60a5fa;stroke-width:1.25}
    .row{fill:#ffffff;stroke:#fdba74;stroke-width:1}
    .rowhi{fill:#ffffff;stroke:#ea580c;stroke-width:2}
    .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.25}
    .num{fill:#ea580c} .numtxt{fill:#ffffff}
    .pipe{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5;stroke-dasharray:10 6}
    .stub{stroke:#ea580c;stroke-width:2.5}
    .bgp{stroke:#2563eb;stroke-width:3;fill:none}
    .advpa{stroke:#ea580c;stroke-width:2.25;fill:none}
    .advaz{stroke:#2563eb;stroke-width:2.25;fill:none}
    .pillpa{fill:#ea580c} .tagpa{fill:#ea580c} .tagaz{fill:#2563eb} .pillaz{fill:#2563eb} .pilltxt{fill:#ffffff}
    .okpill{fill:#dcfce7;stroke:#86efac}
    .peer{stroke:#3b82f6;stroke-width:2;fill:none;stroke-dasharray:4 4}
    .divider{stroke:#e5e7eb;stroke-width:1}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .ink{fill:#e6edf3} .quiet{fill:#9198a1} .accent{fill:#fb923c} .lbl-az{fill:#60a5fa} .ok{fill:#4ade80}
      .fw{fill:#1f1610;stroke:#f97316}
      .az{fill:#0c1a2e;stroke:#3b82f6}
      .azbox{fill:#0d1117;stroke:#3b82f6}
      .row{fill:#0d1117;stroke:#7c4a1e}
      .rowhi{fill:#0d1117;stroke:#f97316}
      .card{fill:#161b22;stroke:#30363d}
      .pipe{fill:#1f1610;stroke:#f97316}
      .stub{stroke:#f97316}
      .bgp{stroke:#60a5fa} .advaz{stroke:#60a5fa} .advpa{stroke:#f97316}
      .okpill{fill:#052e16;stroke:#166534}
      .divider{stroke:#30363d}
    }
  </style>
  <defs>
    <marker id="a-bgp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
    <marker id="a-pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <marker id="a-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700" rx="14"/>

  <text class="ink" x="32" y="46" font-size="24" font-weight="700">BGP over the Azure site-to-site VPN</text>
  <g font-size="13" font-weight="700">
    <rect class="tagpa" x="472" y="26" width="92" height="26" rx="13"/><text class="pilltxt" x="518" y="44" text-anchor="middle">Palo Alto</text>
    <text class="quiet" x="578" y="44" text-anchor="middle" font-size="16">→</text>
    <rect class="tagaz" x="592" y="26" width="68" height="26" rx="13"/><text class="pilltxt" x="626" y="44" text-anchor="middle">Azure</text>
  </g>
  <text class="quiet" x="32" y="70" font-size="14">eBGP inside the IPsec tunnel, with a floating static route as backup</text>

  <!-- ===== PA-440 ===== -->
  <rect class="fw" x="24" y="96" width="380" height="420" rx="14"/>
  <text class="ink" x="44" y="126" font-size="18" font-weight="700">PA-440</text>
  <text class="accent" x="118" y="126" font-size="13" font-weight="600">AS 65010 · router ID 10.100.255.1</text>
  <text class="quiet" x="40" y="155" font-size="11" font-weight="600" letter-spacing="0.8">INTERFACES</text>

  <rect class="rowhi" x="40" y="166" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="185" font-size="13" font-weight="600">tunnel.1 · 10.100.255.1/32</text>
  <text class="quiet" x="54" y="203" font-size="12">BGP source · zone vpn</text>

  <rect class="row" x="40" y="218" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="237" font-size="13" font-weight="600">ethernet1/2 · 10.100.1.0/24</text>
  <text class="quiet" x="54" y="255" font-size="12">Trust LAN · advertised</text>

  <rect class="row" x="40" y="270" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="289" font-size="13" font-weight="600">loopback.2 · 10.100.99.1/32</text>
  <text class="quiet" x="54" y="307" font-size="12">GlobalProtect test target · not advertised</text>

  <text class="quiet" x="40" y="342" font-size="11" font-weight="600" letter-spacing="0.8">ROUTING</text>
  <rect class="row" x="40" y="352" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="371" font-size="13" font-weight="600">Static 10.0.0.30/32 → tunnel.1</text>
  <text class="quiet" x="54" y="389" font-size="12">Reaches the BGP peer</text>

  <rect class="row" x="40" y="404" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="423" font-size="13" font-weight="600">Static 10.0.0.0/15 · AD 240</text>
  <text class="quiet" x="54" y="441" font-size="12">Floating backup</text>

  <rect class="row" x="40" y="456" width="348" height="46" rx="8"/>
  <text class="ink" x="54" y="475" font-size="13" font-weight="600">Redistribution · lab-to-azure</text>
  <text class="quiet" x="54" y="493" font-size="12">Connected LAN → BGP · default route rejected</text>

  <!-- ===== Azure ===== -->
  <rect class="az" x="796" y="96" width="380" height="420" rx="14"/>
  <text class="ink" x="816" y="126" font-size="18" font-weight="700">Azure</text>
  <text class="lbl-az" x="878" y="126" font-size="13" font-weight="600">AS 65515 (fixed by Azure)</text>

  <rect class="azbox" x="812" y="152" width="348" height="84" rx="9" style="stroke-width:2"/>
  <text class="ink" x="828" y="176" font-size="14" font-weight="600">VPN gateway · VpnGw1AZ</text>
  <text class="quiet" x="828" y="196" font-size="12">BGP peer 10.0.0.30 (GatewaySubnet)</text>
  <text class="quiet" x="828" y="214" font-size="12">Public IP used for IKE only</text>

  <rect class="azbox" x="812" y="252" width="348" height="70" rx="9"/>
  <text class="ink" x="828" y="276" font-size="14" font-weight="600">Local network gateway · lng-home</text>
  <text class="quiet" x="828" y="296" font-size="12">Peer 10.100.255.1 · AS 65010 · /32 only</text>

  <rect class="azbox" x="812" y="352" width="160" height="84" rx="9"/>
  <text class="ink" x="828" y="376" font-size="14" font-weight="600">vnet-hub</text>
  <text class="quiet" x="828" y="396" font-size="12">10.0.0.0/16</text>
  <text class="quiet" x="828" y="414" font-size="12">Hosts the gateway</text>

  <rect class="azbox" x="1000" y="352" width="160" height="84" rx="9"/>
  <text class="ink" x="1016" y="376" font-size="14" font-weight="600">vnet-eastasia-1</text>
  <text class="quiet" x="1016" y="396" font-size="12">10.1.0.0/16</text>
  <text class="quiet" x="1016" y="414" font-size="12">Lab-Vm 10.1.0.4</text>

  <line class="peer" x1="972" y1="394" x2="1000" y2="394"/>
  <text class="quiet" x="986" y="462" font-size="12" text-anchor="middle">Peered with gateway transit</text>

  <!-- ===== Middle: three layers ===== -->
  <!-- Layer 1 -->
  <text class="accent" x="600" y="138" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 1 · IPSEC TUNNEL</text>
  <text class="quiet" x="600" y="156" font-size="12" text-anchor="middle">IKEv2 · NAT-T · between public IPs</text>
  <line class="stub" x1="388" y1="189" x2="414" y2="189"/>
  <line class="stub" x1="786" y1="189" x2="812" y2="189"/>
  <rect class="pipe" x="414" y="169" width="372" height="40" rx="20"/>
  <line class="bgp" x1="430" y1="189" x2="770" y2="189" marker-start="url(#a-bgp)" marker-end="url(#a-bgp)"/>

  <!-- Layer 2 -->
  <text class="lbl-az" x="600" y="238" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 2 · BGP SESSION</text>
  <text class="ink" x="600" y="257" font-size="13" font-weight="600" text-anchor="middle">eBGP · TCP 179 · multihop 2</text>
  <text class="quiet" x="600" y="275" font-size="12" text-anchor="middle">10.100.255.1 ⇄ 10.0.0.30</text>

  <line class="divider" x1="440" y1="296" x2="760" y2="296"/>

  <!-- Layer 3 -->
  <text class="ink" x="600" y="322" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 3 · ROUTES</text>

  <rect class="pillpa" x="478" y="338" width="60" height="20" rx="10"/>
  <text class="pilltxt" x="508" y="352" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.6">UPDATE</text>
  <text class="ink" x="546" y="353" font-size="13" font-weight="600">10.100.1.0/24 · AS 65010</text>
  <line class="advpa" x1="420" y1="372" x2="780" y2="372" marker-end="url(#a-pa)"/>

  <rect class="pillaz" x="454" y="398" width="60" height="20" rx="10"/>
  <text class="pilltxt" x="484" y="412" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.6">UPDATE</text>
  <text class="ink" x="522" y="413" font-size="13" font-weight="600">10.0.0.0/16 · 10.1.0.0/16 · AS 65515</text>
  <line class="advaz" x1="420" y1="432" x2="780" y2="432" marker-start="url(#a-az)"/>

  <rect class="okpill" x="440" y="466" width="320" height="30" rx="15"/>
  <text class="ok" x="600" y="486" font-size="12" font-weight="600" text-anchor="middle">✓ Verified: Azure learned 10.100.1.0/24 as EBgp</text>

  <!-- ===== Why cards ===== -->
  <text class="ink" x="32" y="552" font-size="16" font-weight="700">Why it is built this way</text>

  <g font-size="12">
    <rect class="card" x="24" y="566" width="218" height="112" rx="10"/>
    <circle class="num" cx="44" cy="588" r="11"/><text class="numtxt" x="44" y="592" text-anchor="middle" font-weight="700">1</text>
    <text class="ink" x="62" y="593" font-size="13" font-weight="600">Peer on tunnel IPs</text>
    <text class="quiet" x="38" y="620">Azure runs BGP only on its</text>
    <text class="quiet" x="38" y="638">private IP. Updates stay</text>
    <text class="quiet" x="38" y="656">inside the encrypted tunnel.</text>

    <rect class="card" x="257" y="566" width="218" height="112" rx="10"/>
    <circle class="num" cx="277" cy="588" r="11"/><text class="numtxt" x="277" y="592" text-anchor="middle" font-weight="700">2</text>
    <text class="ink" x="295" y="593" font-size="13" font-weight="600">eBGP multihop 2</text>
    <text class="quiet" x="271" y="620">10.0.0.30 shares no subnet</text>
    <text class="quiet" x="271" y="638">with tunnel.1, so the session</text>
    <text class="quiet" x="271" y="656">needs one extra hop.</text>

    <rect class="card" x="490" y="566" width="218" height="112" rx="10"/>
    <circle class="num" cx="510" cy="588" r="11"/><text class="numtxt" x="510" y="592" text-anchor="middle" font-weight="700">3</text>
    <text class="ink" x="528" y="593" font-size="13" font-weight="600">Static /32 to the peer</text>
    <text class="quiet" x="504" y="620">BGP can't learn the path to</text>
    <text class="quiet" x="504" y="638">its own neighbor. This route</text>
    <text class="quiet" x="504" y="656">does (the "?" route flag).</text>

    <rect class="card" x="723" y="566" width="218" height="112" rx="10"/>
    <circle class="num" cx="743" cy="588" r="11"/><text class="numtxt" x="743" y="592" text-anchor="middle" font-weight="700">4</text>
    <text class="ink" x="761" y="593" font-size="13" font-weight="600">lng-home is a /32</text>
    <text class="quiet" x="737" y="620">Azure learns the LAN via BGP,</text>
    <text class="quiet" x="737" y="638">so it only needs the PA's</text>
    <text class="quiet" x="737" y="656">peer address.</text>

    <rect class="card" x="956" y="566" width="220" height="112" rx="10"/>
    <circle class="num" cx="976" cy="588" r="11"/><text class="numtxt" x="976" y="592" text-anchor="middle" font-weight="700">5</text>
    <text class="ink" x="994" y="593" font-size="13" font-weight="600">Floating static</text>
    <text class="quiet" x="970" y="620">eBGP (AD 20) wins. The /15</text>
    <text class="quiet" x="970" y="638">static (AD 240) takes over</text>
    <text class="quiet" x="970" y="656">if BGP drops.</text>
  </g>
</svg>
